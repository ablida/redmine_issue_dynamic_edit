de:
  ide_txt_notice_conflict_title : "Dieser Eintrag wurde von jemand anderem aktualisiert, während Sie es bearbeitet haben."
  ide_txt_notice_conflict_link : "Aktualisieren Sie die Seite, um die neuen Daten zu laden."
  ide_txt_notice_conflict_text  : "Ihre aktuellen Änderungen gehen dabei verloren."
  option_visual_editor_mode_switch_tab: "Tab zum Umschalten in den visuellen Editor-Modus aktivieren"
  settings_display_edit_icon : "Anzeigemodus für Bearbeitungssymbole"
  settings_display_edit_icon_explanations : "Legt fest, ob beim Überfahren des Detailbereichs alle Stiftsymbole neben den bearbeitbaren Werten angezeigt werden oder ob der Benutzer jeden Wert einzeln überfahren muss, um zu prüfen, ob er bearbeitbar ist"
  option_display_edit_icon_single: "Einzeln (Hover pro Wert)"
  option_display_edit_icon_multiple: "Mehrfach (Hover über den Bereich zeigt alle Symbole)"
  settings_force_https: "HTTPS für AJAX-Aufrufe erzwingen"
  settings_force_https_explanation: "Erzwingt das HTTPS-Protokoll für XHR-Aufrufe, um Mixed-Content-Fehler in der JS-Konsole zu vermeiden"
  settings_listener_type_value: "Listener-Aktion für Wert"
  settings_listener_type_icon: "Listener-Aktion für Symbol"
  settings_listener_target: "Zielbereich des Listeners"
  settings_listener_target_explanation: "Bereich, auf den der Listener reagiert: value, iconEdit, label oder all"
  settings_excluded_field_id: "Ausgeschlossene Feld-IDs (Tags)"
  settings_excluded_field_id_explanation: "Liste von Formularfeld-IDs, die von der dynamischen Bearbeitung ausgeschlossen werden. Beispiel-Tags: status, priority, custom_field_values_4"
  settings_excluded_field_placeholder: "Tag eingeben und Enter drücken"
  settings_check_issue_update_conflict: "Auf Aktualisierungskonflikte bei Einträgen prüfen"
  settings_check_issue_update_conflict_explanation: "Wenn aktiviert, prüft das Plugin auf gleichzeitige Aktualisierungen und verhindert, dass Änderungen anderer Benutzer überschrieben werden"
  ide_txt_copy_to_clipboard: "In die Zwischenablage kopieren"
  ide_txt_copied_to_clipboard: "Kopiert!"
